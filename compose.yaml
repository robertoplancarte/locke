services:
  postgres:
    # Fully qualified image name so podman doesn't prompt for a registry
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: password
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
